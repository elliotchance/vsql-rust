name: Release

# Publishes vsql-sys and vsql to crates.io when a GitHub release is published.
# The release's tag must be the version in Cargo.toml (v1.2.3 for 1.2.3).
#
# It uses crates.io trusted publishing. Until it's set up for both crates
# (which needs them to exist on crates.io), set the CARGO_REGISTRY_TOKEN secret
# to a crates.io API token instead.

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/vsql
    permissions:
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Check the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          metadata="$(cargo metadata --no-deps --format-version 1)"
          for package in vsql vsql-sys; do
            got="$(jq -r --arg p "$package" '.packages[] | select(.name == $p) | .version' <<< "$metadata")"
            if [ "$got" != "$version" ]; then
              echo "::error::$package is version $got, but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done
          requirement="$(jq -r '.packages[] | select(.name == "vsql") | .dependencies[] | select(.name == "vsql-sys") | .req' <<< "$metadata")"
          if [ "$requirement" != "=$version" ]; then
            echo "::error::vsql depends on vsql-sys $requirement, but it should be =$version"
            exit 1
          fi
      - run: cargo test --all-features
      - uses: rust-lang/crates-io-auth-action@v1.0.5
        id: auth
        if: env.HAS_TOKEN != 'true'
      - run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
