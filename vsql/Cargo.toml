[package]
name = "vsql"
description = "An embedded SQL database: vsql, compiled into the crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["vsql", "sql", "database", "embedded"]
categories = ["database"]

[dependencies]
vsql-sys = { version = "=0.0.0", path = "../vsql-sys" }
chrono = { version = "0.4.42", optional = true, default-features = false }
time = { version = "0.3.36", optional = true, default-features = false }
rust_decimal = { version = "1.43", optional = true, default-features = false, features = ["std"] }
r2d2 = { version = "0.8", optional = true }
deadpool = { version = "0.12", optional = true, default-features = false, features = ["managed"] }
serde = { version = "1.0.200", optional = true, default-features = false, features = ["std"] }

[features]
chrono = ["dep:chrono"]
time = ["dep:time"]
rust_decimal = ["dep:rust_decimal"]
r2d2 = ["dep:r2d2"]
deadpool = ["dep:deadpool"]
serde = ["dep:serde"]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
serde = { version = "1.0.200", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros"] }
