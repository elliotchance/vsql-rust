[workspace]
members = ["vsql", "vsql-sys"]
resolver = "2"

[workspace.package]
# vsql and vsql-sys are released together, with the same version. The release
# workflow checks that it's the version of the release's tag.
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["Elliot Chance <elliotchance@gmail.com>"]
repository = "https://github.com/elliotchance/vsql-rust"
